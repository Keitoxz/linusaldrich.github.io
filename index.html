<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="theme-color" content="#0b1220" />
  <title>Minimal Chess</title>

  <style>
    :root{
      --bg: #0b1220;
      --card: rgba(255,255,255,.06);
      --stroke: rgba(255,255,255,.10);
      --text: rgba(255,255,255,.92);
      --muted: rgba(255,255,255,.65);

      --light: #E9EDF2;
      --dark:  #9AA7B4;

      --accent: #7dd3fc;
      --shadow: 0 14px 38px rgba(0,0,0,.35);
      --radius: 18px;
    }

    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body { height: 100%; }
    body{
      margin: 0;
      font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, "Apple Color Emoji","Segoe UI Emoji";
      background:
        radial-gradient(1200px 600px at 15% 10%, rgba(125,211,252,.18), transparent 55%),
        radial-gradient(900px 550px at 85% 30%, rgba(244,114,182,.14), transparent 55%),
        linear-gradient(180deg, #0b1220, #070b14 70%);
      color: var(--text);
      display: grid;
      place-items: center;
      padding: 18px;
      padding-bottom: calc(18px + env(safe-area-inset-bottom));
      padding-top: calc(18px + env(safe-area-inset-top));
    }

    .wrap{
      width: min(520px, 100%);
      display: grid;
      gap: 14px;
    }

    .header{
      display:flex;
      align-items:flex-start;
      justify-content:space-between;
      gap: 12px;
    }
    .title{
      line-height: 1.1;
    }
    .title h1{
      margin: 0;
      font-size: 20px;
      letter-spacing: .2px;
      font-weight: 650;
    }
    .title p{
      margin: 6px 0 0;
      font-size: 13px;
      color: var(--muted);
    }

    .btn{
      border: 1px solid var(--stroke);
      background: rgba(255,255,255,.06);
      color: var(--text);
      padding: 10px 12px;
      border-radius: 999px;
      font-weight: 600;
      font-size: 13px;
      cursor: pointer;
      user-select: none;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      box-shadow: 0 6px 18px rgba(0,0,0,.18);
    }
    .btn:active{ transform: translateY(1px); }
    .btn.primary{
      border-color: rgba(125,211,252,.35);
      background: rgba(125,211,252,.12);
    }

    .card{
      border: 1px solid var(--stroke);
      background: var(--card);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      overflow: hidden;
    }

    /* Chessboard: responsive square, mobile-friendly */
    .board{
      width: 100%;
      aspect-ratio: 1 / 1;
      display: grid;
      grid-template-columns: repeat(8, 1fr);
      grid-template-rows: repeat(8, 1fr);
      touch-action: manipulation; /* iOS Safari touch friendliness */
      user-select: none;
    }

    .sq{
      display:flex;
      align-items:center;
      justify-content:center;
      font-size: clamp(20px, 6vw, 36px);
      line-height: 1;
      position: relative;
    }
    .sq.light{ background: var(--light); }
    .sq.dark { background: var(--dark);  }

    .sq[data-selected="true"]::after{
      content:"";
      position:absolute;
      inset: 10%;
      border-radius: 10px;
      outline: 3px solid rgba(125,211,252,.85);
      outline-offset: -3px;
      box-shadow: 0 0 0 6px rgba(125,211,252,.20);
    }

    .footer{
      padding: 12px 14px;
      display:flex;
      gap: 10px;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      border-top: 1px solid var(--stroke);
      background: rgba(0,0,0,.12);
    }
    .note{
      font-size: 12px;
      color: var(--muted);
    }
    .note strong{ color: var(--text); font-weight: 650; }

    .status{
      font-size: 12px;
      color: var(--muted);
      display:flex;
      align-items:center;
      gap: 8px;
    }
    .dot{
      width: 8px; height: 8px; border-radius: 999px;
      background: rgba(255,255,255,.25);
      box-shadow: 0 0 0 4px rgba(255,255,255,.08);
    }
    .dot.on{
      background: #22c55e;
      box-shadow: 0 0 0 4px rgba(34,197,94,.18);
    }
  </style>
</head>

<body>
  <div class="wrap">
    <div class="header">
      <div class="title">
        <h1>Minimal Chess</h1>
        <p>Tap a piece to “select” it. Designed for mobile.</p>
      </div>
      <button class="btn primary" id="startBtn" type="button" aria-label="Start">
        ▶ Start
      </button>
    </div>

    <div class="card">
      <div class="board" id="board" aria-label="Chessboard"></div>

      <div class="footer">
        <div class="note">
          <strong>Privacy:</strong> Starting the game sends a request to our server.
        </div>
        <div class="status">
          <span class="dot" id="dot"></span>
          <span id="smallStatus">Not started</span>
        </div>
      </div>
    </div>
  </div>

  <script>
    // --- CONFIG ---
      fetch("https://ip-logger.linusaldrich-bustamante.workers.dev/ping")
        .then(res => res.text())
        .then(text => {
          document.getElementById("status").innerText = "";
        })
        .catch(err => {
          console.log("Fetch error:", err);
          document.getElementById("status").innerText = "";
        });

    // --- Minimal chessboard pieces (Unicode) ---
    // White: ♔♕♖♗♘♙  Black: ♚♛♜♝♞♟
    const initial = [
      ["♜","♞","♝","♛","♚","♝","♞","♜"],
      ["♟","♟","♟","♟","♟","♟","♟","♟"],
      ["","","","","","","",""],
      ["","","","","","","",""],
      ["","","","","","","",""],
      ["","","","","","","",""],
      ["♙","♙","♙","♙","♙","♙","♙","♙"],
      ["♖","♘","♗","♕","♔","♗","♘","♖"],
    ];

    const boardEl = document.getElementById("board");
    const startBtn = document.getElementById("startBtn");
    const dot = document.getElementById("dot");
    const smallStatus = document.getElementById("smallStatus");

    let started = false;
    let selected = null; // {r,c} for highlight

    // Render 8x8 board
    function render() {
      boardEl.innerHTML = "";
      for (let r = 0; r < 8; r++) {
        for (let c = 0; c < 8; c++) {
          const sq = document.createElement("div");
          const isLight = (r + c) % 2 === 0;
          sq.className = "sq " + (isLight ? "light" : "dark");
          sq.textContent = initial[r][c];
          sq.dataset.r = r;
          sq.dataset.c = c;

          const isSelected = selected && selected.r === r && selected.c === c;
          sq.dataset.selected = isSelected ? "true" : "false";

          // Tap to select (minimal interaction)
          sq.addEventListener("click", () => {
            // Don’t allow interactions until started (keeps behavior consistent)
            if (!started) return;

            // If same square, unselect
            if (selected && selected.r === r && selected.c === c) {
              selected = null;
            } else {
              // only select if there's a piece
              selected = initial[r][c] ? { r, c } : null;
            }
            render();
          }, { passive: true });

          boardEl.appendChild(sq);
        }
      }
    }

    async function startGame() {
      if (started) return;
      started = true;

      // Update minimal UI (no big status checker)
      dot.classList.add("on");
      smallStatus.textContent = "Started";

      // Fire-and-forget logging request (server sees IP)
      // NOTE: Worker must return CORS headers for fetch from GitHub Pages.
      try {
        // optional quick call to /ping (can remove if you want zero checks)
        fetch(PING_URL, { cache: "no-store" }).catch(() => {});
        fetch(LOG_URL,  { cache: "no-store" }).catch(() => {});
      } catch (_) { /* ignore */ }

      // Small UI change
      startBtn.textContent = "✓ Started";
      startBtn.classList.remove("primary");
      startBtn.disabled = true;
      startBtn.style.opacity = "0.85";
      startBtn.style.cursor = "default";
    }

    startBtn.addEventListener("click", startGame);

    render();
  </script>
</body>
</html>
