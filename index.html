<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Will you be my Valentine? 💘</title>
  <style>
    :root{
      --pink-1:#ffe6f0;
      --pink-2:#ffd1e6;
      --pink-4:#ff5fa5;
      --rose-1:#ff6f91;
      --shadow: 0 10px 25px rgba(255, 105, 180, .35);

      /* Dynamic sizes controlled by JS (in-FLOW, not transforms) */
      --yes-font: 1.25rem;   /* grows */
      --yes-padY: 1.1rem;
      --yes-padX: 1.4rem;

      --no-font: 1.20rem;    /* shrinks */
      --no-padY: 0.95rem;
      --no-padX: 1.2rem;

      --gap: 0.9rem;
      --radius: 18px;
    }

    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      margin: 0;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, "Helvetica Neue", Arial, "Noto Emoji", sans-serif;
      color: #4a1f2c;
      background:
        radial-gradient(1200px 1200px at 10% -10%, #fff0f6 20%, transparent 60%),
        radial-gradient(1000px 800px at 110% 10%, #ffe4f1 0%, transparent 60%),
        linear-gradient(180deg, var(--pink-1), var(--pink-2));
      overflow-x: hidden; /* allow vertical growth, prevent horizontal spill */
      touch-action: manipulation;
      -webkit-tap-highlight-color: transparent;
    }

    .wrapper {
      min-height: 100dvh;
      padding: 2rem 1.25rem max(2rem, env(safe-area-inset-bottom));
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 1.125rem;
      position: relative;
      text-align: center;
    }

    h1 {
      margin: 0;
      font-size: clamp(1.6rem, 5.2vw, 2.6rem);
      line-height: 1.15;
      letter-spacing: 0.2px;
      text-shadow: 0 2px 0 #ffffffcc, 0 6px 24px #ff7ab6aa;
    }

    .tease {
      min-height: 1.8em;
      font-size: clamp(1rem, 4vw, 1.15rem);
      opacity: .95;
    }

    /* 🔒 Always vertical (prevents any overlap) */
    .buttons {
      width: min(520px, 100%);
      display: flex;
      flex-direction: column;
      gap: var(--gap);
      align-items: stretch;   /* buttons fill width */
      justify-content: center;
      margin-top: .5rem;
    }

    .btn {
      appearance: none;
      border: 0;
      border-radius: var(--radius);
      font-weight: 800;
      letter-spacing: .3px;
      color: #fff;
      cursor: pointer;
      transition: box-shadow .18s ease, filter .18s ease, opacity .25s ease;
      box-shadow: 0 8px 18px rgba(0,0,0,.08), var(--shadow);
      user-select: none;
      touch-action: manipulation;
      width: 100%;
      max-width: 100%;
      line-height: 1.2;
      /* enforce tappable size even when small */
      min-height: 44px; /* Apple HIG minimum */
    }

    .btn:active { filter: brightness(.98); }

    .btn.yes {
      background-image: linear-gradient(135deg, var(--rose-1), var(--pink-4));
      text-shadow: 0 1px 0 #d52d6b;

      /* in-flow growth */
      font-size: var(--yes-font);
      padding: var(--yes-padY) var(--yes-padX);
    }

    .btn.no {
      background-image: linear-gradient(135deg, #ff9db5, #ff7fa1);
      text-shadow: 0 1px 0 #cc4d6f;

      /* in-flow shrink */
      font-size: var(--no-font);
      padding: var(--no-padY) var(--no-padX);

      align-self: center;     /* keep centered under YES */
      max-width: 320px;       /* keep a neat small pill as it shrinks */
    }

    /* When YES takes the whole screen */
    .yes.full {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100vh;
      border-radius: 0;
      z-index: 30;
      font-size: clamp(2rem, 10vw, 6rem) !important;
      display: grid;
      place-items: center;
      box-shadow: none;
      animation: breathing 2.2s ease-in-out infinite;
    }

    @keyframes breathing {
      0%,100% { filter: brightness(1); }
      50%     { filter: brightness(1.08); }
    }

    /* Floating hearts */
    .particle {
      position: fixed;
      font-size: 16px;
      pointer-events: none;
      z-index: 40;
      animation: floatUp 1600ms ease-in forwards;
      will-change: transform, opacity;
    }
    @keyframes floatUp {
      0%   { transform: translateY(0) scale(0.8) rotate(0deg); opacity: 1; }
      70%  { transform: translateY(-90px) scale(1.15) rotate(12deg); opacity: .9; }
      100% { transform: translateY(-140px) scale(0.9) rotate(-6deg); opacity: 0; }
    }

    /* Celebration overlay on YES */
    .overlay {
      position: fixed;
      inset: 0;
      background: linear-gradient(180deg, #ffe1ee, #ffd3ea);
      display: none;
      place-items: center;
      z-index: 50;
    }
    .overlay.show { display: grid; }
    .yay {
      text-align: center;
      padding: 1.5rem;
      animation: pop .45s ease;
    }
    .yay h2 {
      margin: 0 0 .3rem;
      font-size: clamp(2rem, 11vw, 5rem);
      color: #d21b66;
      text-shadow: 0 2px 0 #fff, 0 12px 40px #ff60a4aa;
    }
    .yay p {
      margin: 0;
      font-size: clamp(1.1rem, 4.5vw, 1.5rem);
      color: #7a2b47;
    }
    @keyframes pop {
      0% { transform: scale(.7); opacity: 0; }
      100% { transform: scale(1); opacity: 1; }
    }

    /* Optional: respect reduced motion */
    @media (prefers-reduced-motion: reduce) {
      * { animation: none !important; transition: none !important; }
    }
  </style>
</head>
<body>
  <main class="wrapper" id="wrap">
    <h1>Will you be my Valentine? 💘</h1>
    <p class="tease" id="tease" aria-live="polite">Pretty please? 🥺💕</p>

    <div class="buttons" id="buttonGrid">
      <button class="btn yes" id="yesBtn">YES ❤️</button>
      <button class="btn no" id="noBtn">NO 🙈</button>
    </div>
  </main>

  <!-- Celebration -->
  <section class="overlay" id="yayOverlay" role="dialog" aria-modal="true" aria-label="Celebration">
    <div class="yay">
      <h2>YAAAAAAYYY! 💖🎉</h2>
      <p>You just made my heart do a happy dance! 💞🫶</p>
    </div>
  </section>

  <script>
    const yesBtn   = document.getElementById('yesBtn');
    const noBtn    = document.getElementById('noBtn');
    const teaseEl  = document.getElementById('tease');
    const overlay  = document.getElementById('yayOverlay');

    let noClicks = 0;

    const teasers = [
      "Pretty please? 🥺💕",
      "Are you suuuure? 😽💘",
      "Think again… I have chocolate 🍫😉",
      "C’mon, it’ll be cute! 🌸",
      "What if I add extra hugs? 🤗💓",
      "Last chance before the YES gets HUGE! 🎈",
      "Okay now it’s getting serious 😤💗",
      "You can’t resist forever… 😏💞",
      "Fine, I’ll make YES gigantic! 😆✨",
      "Hehe gotcha! Tap YES! 😜💝"
    ];
    const heartEmojis = ["💖","💘","💝","💕","💞","💗","❤️","🩷"];

    function vibrate(pattern = 30) {
      if (navigator.vibrate) try { navigator.vibrate(pattern); } catch(e){}
    }

    function randomBetween(min, max) {
      return Math.random() * (max - min) + min;
    }

    function spawnHearts(count = 8, nearEl = null) {
      const rect = nearEl ? nearEl.getBoundingClientRect() : {left: window.innerWidth/2, top: window.innerHeight/2, width: 0, height: 0};
      for (let i = 0; i < count; i++) {
        const span = document.createElement('span');
        span.className = 'particle';
        span.textContent = heartEmojis[Math.floor(Math.random()*heartEmojis.length)];
        const startX = rect.left + rect.width/2 + randomBetween(-40, 40);
        const startY = rect.top + rect.height/2 + randomBetween(-10, 10);
        span.style.left = `${startX}px`;
        span.style.top  = `${startY}px`;
        span.style.fontSize = `${randomBetween(14, 22)}px`;
        document.body.appendChild(span);
        setTimeout(() => span.remove(), 1700 + Math.random()*400);
      }
    }

    // Helpers to update CSS variables for in-flow sizing
    function setYesSize(font, padY, padX) {
      document.documentElement.style.setProperty('--yes-font', font + 'rem');
      document.documentElement.style.setProperty('--yes-padY', padY + 'rem');
      document.documentElement.style.setProperty('--yes-padX', padX + 'rem');
    }
    function setNoSize(font, padY, padX) {
      document.documentElement.style.setProperty('--no-font', font + 'rem');
      document.documentElement.style.setProperty('--no-padY', padY + 'rem');
      document.documentElement.style.setProperty('--no-padX', padX + 'rem');
    }

    // Baselines
    let yesFont = 1.25, yesPadY = 1.1, yesPadX = 1.4;
    let noFont  = 1.20, noPadY  = 0.95, noPadX  = 1.2;

    function onNoClick() {
      noClicks++;
      vibrate([20, 20, 20]);

      // Grow YES in-flow (font + padding)
      yesFont = Math.min(yesFont + (0.22 + noClicks*0.05), 3.6); // 3.6rem cap before full-screen
      yesPadY = Math.min(yesPadY + 0.20, 4.5);
      yesPadX = Math.min(yesPadX + 0.24, 5.5);
      setYesSize(yesFont, yesPadY, yesPadX);

      // Shrink NO in-flow but keep tappable for a while
      noFont = Math.max(noFont - 0.10, 0.80);
      noPadY = Math.max(noPadY - 0.08, 0.60);
      noPadX = Math.max(noPadX - 0.10, 0.80);
      setNoSize(noFont, noPadY, noPadX);

      if (noFont <= 0.9) {
        noBtn.style.opacity = 0.8;
      }
      if (noFont <= 0.8) {
        noBtn.style.pointerEvents = 'none';
      }

      // Update tease and hearts
      teaseEl.textContent = teasers[Math.min(noClicks, teasers.length - 1)];
      spawnHearts(Math.min(12, 6 + noClicks), noBtn);

      // If YES is visually massive, switch to full-screen button
      const yesRect = yesBtn.getBoundingClientRect();
      if (yesRect.height >= window.innerHeight * 0.38 || yesRect.width >= window.innerWidth * 0.9) {
        yesBtn.classList.add('full');
        noBtn.style.opacity = 0;
        noBtn.style.pointerEvents = 'none';
        teaseEl.textContent = "Okay okay, you win 😆 Tap YES! 💓";
      }
    }

    function confettiBurst(times = 6, interval = 180) {
      let i = 0;
      const id = setInterval(() => {
        spawnHearts(16, yesBtn);
        if (++i >= times) clearInterval(id);
      }, interval);
    }

    function onYesClick() {
      vibrate([30, 60, 30]);
      overlay.classList.add('show');
      confettiBurst(10, 140);
    }

    // Wire events
    noBtn.addEventListener('click', onNoClick);
    yesBtn.addEventListener('click', onYesClick);

    // Initialize CSS vars explicitly
    setYesSize(yesFont, yesPadY, yesPadX);
    setNoSize(noFont, noPadY, noPadX);
  </script>
</body>
</html>
